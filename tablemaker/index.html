<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TableMaker - Automated Answer Key Extractor & Grid Table Generator from PDF, Word documents, and text." />
    <title>TableMaker | Automatic Answer Key Grid Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" crossorigin src="./assets/index-tmB7VnsH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bqfv8UOl.css">
    <style>
      .tm-download-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
      }
      .btn-download-png {
        background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 50%, #4c1d95 100%) !important;
        color: #ffffff !important;
        font-family: 'Outfit', sans-serif !important;
        font-weight: 800 !important;
        font-size: 0.92rem !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
        padding: 10px 24px !important;
        border-radius: 50px !important;
        border: 1.5px solid rgba(255, 255, 255, 0.4) !important;
        cursor: pointer !important;
        box-shadow: 0 4px 18px rgba(124, 58, 237, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3) !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 10px !important;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      }
      .btn-download-png:hover {
        transform: translateY(-2px) scale(1.04) !important;
        box-shadow: 0 8px 25px rgba(124, 58, 237, 0.6) !important;
        filter: brightness(1.12) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      window.downloadDocumentViewPNG = function() {
        const tabs = document.querySelectorAll('.view-tab');
        tabs.forEach(t => {
          if (t.innerText.includes('Document')) t.click();
        });
        
        setTimeout(() => {
          const target = document.querySelector('.document-sheet') || document.querySelector('.document-paper-container') || document.querySelector('.sections-grid');
          if (!target) {
            alert("No document view found to download!");
            return;
          }
          
          if (window.html2canvas) {
            window.html2canvas(target, {
              scale: 2,
              backgroundColor: '#ffffff',
              useCORS: true
            }).then(canvas => {
              const link = document.createElement('a');
              link.download = `document_view_${new Date().toISOString().split('T')[0]}.png`;
              link.href = canvas.toDataURL('image/png');
              link.click();
            }).catch(err => {
              console.error(err);
              alert("Failed to capture image.");
            });
          }
        }, 350);
      };

      // Periodically inject Download PNG button into TableMaker view-mode-bar
      setInterval(() => {
        const viewModeBar = document.querySelector('.view-mode-bar');
        if (viewModeBar && !viewModeBar.querySelector('.tm-download-bar')) {
          const bar = document.createElement('div');
          bar.className = 'tm-download-bar';
          bar.innerHTML = `
            <button class="btn-download-png" onclick="window.downloadDocumentViewPNG()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              Download Document View (.PNG)
            </button>
          `;
          viewModeBar.appendChild(bar);
        }
      }, 500);
    </script>
  </body>
</html>
